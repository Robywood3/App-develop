name: Crea pacchetto webOS (.ipk)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Crea i pacchetti
        run: npm run package && npm run package:ha

      - uses: actions/upload-artifact@v4
        with:
          name: ezviz-tv-ipk
          path: dist/com.robywood.ezviztv_*.ipk

      - uses: actions/upload-artifact@v4
        with:
          name: ha-monitor-ipk
          path: dist/com.robywood.hamonitor_*.ipk
