name: Crea pacchetto webOS (.ipk)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Crea il pacchetto
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: ezviz-tv-ipk
          path: dist/*.ipk
